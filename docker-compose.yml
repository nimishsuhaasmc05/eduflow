version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eduflow_postgres
    environment:
      POSTGRES_DB: eduflow
      POSTGRES_USER: eduflow_user
      POSTGRES_PASSWORD: eduflow_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduflow_user -d eduflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduflow_backend
    command: sh -c "python -m alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://eduflow_user:eduflow_secure_password_2026@postgres:5432/eduflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=eduflow-production-super-secret-jwt-key-2026
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduflow_celery
    command: celery -A app.workers.celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg://eduflow_user:eduflow_secure_password_2026@postgres:5432/eduflow
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: eduflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
