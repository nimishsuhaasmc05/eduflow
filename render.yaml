services:
  # FastAPI Web Service
  - type: web
    name: eduflow-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eduflow-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard

  # Celery Background Worker
  - type: worker
    name: eduflow-celery-worker
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.workers.celery_worker.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eduflow-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: eduflow-db
    databaseName: eduflow
    user: eduflow_user
    plan: free

# Render managed Redis
redis:
  - name: eduflow-redis
    plan: free
    ipAllowList: []
