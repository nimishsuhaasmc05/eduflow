services:
  # FastAPI Web Service (Render Free Tier)
  - type: web
    name: eduflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard

databases:
  # PostgreSQL Database (Render Free Tier)
  - name: eduflow-db
    databaseName: eduflow
    user: eduflow_user
    plan: free
